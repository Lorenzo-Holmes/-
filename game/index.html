let P=JSON.parse(localStorage.getItem('fridge_clear_v1')||'{"un":1,"best":{},"last":1}'),S=null,Q=null,timer=null;const app=document.getElementById('app'),name=i=>I[i]?.[0]||i,emoji=i=>I[i]?.[1]||'🥣',stars=n=>'★'.repeat(n)+'☆'.repeat(3-n),counts=a=>a.reduce((m,x)=>(m[x]=(m[x]||0)+1,m),{}),save=()=>localStorage.setItem('fridge_clear_v1',JSON.stringify(P));

function renderGame(){app.innerHTML=`<section class="screen game"><header class="game-head"><div class="top"><span class="day">DAY ${Q[0]}</span><span class="game-title">${Q[1]}</span><button class="finish" id="finish">结束</button></div><div class="urgent"><b>今天必须处理</b><div id="urgentChips" style="display:flex;gap:4px;overflow:hidden"></div></div><div class="budgets" id="budgets"></div></header><section class="fridge" id="fridge"></section><section class="menu"><b>今晚菜单</b><span id="doneCount">0 道</span><div class="done" id="doneList"></div><button class="possible" id="possible">还能做</button></section><section class="cook"><div class="hint" id="hint">点击食材放进料理区</div><div class="slots" id="slots"></div><div class="station"><div class="pot"></div><div class="actions"><button class="clear" id="clear">清空</button><button class="fire" id="fire">再想想</button></div></div></section><div class="toast" id="toast"></div><div class="shade" id="shade"></div><aside class="drawer" id="drawer"><div class="drawer-head"><b>今晚还能做</b><button class="close" id="close">关闭</button></div><div id="recipeList"></div></aside><div class="modal-wrap" id="modalWrap"><div class="modal" id="modal"></div></div></section>`;finish.onclick=finishRequested;possible.onclick=()=>setDrawer(true);close.onclick=()=>setDrawer(false);shade.onclick=()=>setDrawer(false);clear.onclick=()=>{S.sel=[];update()};fire.onclick=cook;update()}

function relation(r){const c=counts(S.sel);for(const[i,n]of Object.entries(c))if(n>(r[1][i]||0))return 0;const exact=Object.entries(r[1]).every(([i,n])=>(c[i]||0)===n)&&Object.keys(c).every(i=>r[1][i]!=null);return exact?2:1}

function renderCookState(){const id=matchedId(),subset=Q[5].some(i=>relation(R[i])===1);fire.classList.remove('ready');if(id){const r=R[id],p=projection(r);hint.innerHTML=r[0]+`<span style="font-size:8px;color:${p[0]?'#d34f37':'#68823f'}">${p[1]}</span>`;fire.textContent='开火！';fire.classList.add('ready')}else{hint.textContent=!S.sel.length?'点击食材放进料理区':subset?'好像能做点什么……':'这几样好像不太搭。';fire.textContent='再想想'}}
function renderMenu(){doneCount.textContent=S.done.length+' 道';doneList.innerHTML=S.done.map(i=>`<span>${R[i][0]}</span>`).join('');possible.textContent=`还能做 ${possibleIds().length} 道 ＞`}
function renderRecipes(){recipeList.innerHTML=Q[5].map(id=>{const r=R[id],done=S.done.includes(id),ok=canMake(r)&&!done,p=projection(r),need=Object.entries(r[1]).map(([i,n])=>name(i)+'×'+n).join(' + ');return`<div class="recipe ${done||!ok?'off':p[0]?'warn':''}"><div><div class="recipe-name">${r[0]}</div><div class="recipe-need">${need}</div><div class="recipe-meta">👥${r[2]} · ⏱${r[3]}${Q[6].cm?' · 🔥'+r[5]:''}</div></div><div class="recipe-state">${done?'已完成':ok?(p[0]?'会超目标':'可以做'):'做不了'}</div></div>`}).join('')}
function setDrawer(v){drawer.classList.toggle('show',v);shade.classList.toggle('show',v)}function addIngredient(i){const c=counts(S.sel);if(S.sel.length>=4){showToast('锅里放不下更多了');return}if((S.inv[i]||0)<=(c[i]||0))return;S.sel.push(i);update()}
function cook(){const id=matchedId();if(!id)return;const r=R[id],before=possibleIds();for(const[i,n]of Object.entries(r[1]))S.inv[i]-=n;S.done.push(id);S.sel=[];S.m.t+=r[3];S.m.s+=r[2];S.m.k+=r[5];update();const after=possibleIds(),closed=before.filter(x=>x!==id&&!after.includes(x));showToast(closed.length?closed.map(x=>R[x][0]).join('、')+' 暂时做不了了':r[0]+' 完成')}
function remainingUrgent(){return Object.entries(Q[4]).reduce((s,[i,n])=>s+Math.min(S.inv[i]||0,n),0)}function stats(){const remain=remainingUrgent(),used=S.urgentTotal-remain,clear=S.urgentTotal?used/S.urgentTotal:1,left=[];Object.entries(Q[4]).forEach(([i,n])=>{const q=Math.min(S.inv[i]||0,n);if(q)left.push(name(i)+'×'+q)});const avg=S.done.length?S.done.reduce((s,i)=>s+R[i][4],0)/S.done.length:0,grade=avg>=90?'S':avg>=75?'A':avg>=60?'B':'C',x={u:used,c:clear,t:S.m.t,s:S.m.s,k:S.m.k,left,g:grade,d:S.done.length};x.star=1+(Q[7](x)?1:0)+(Q[8](x)?1:0);return x}
function finishRequested(){const s=stats();if(s.left.length){showModal(`<h2>现在结束今晚？</h2><p>还有 ${s.left.join('、')} 没处理，它们会计入浪费。</p><div class="modal-actions"><button class="secondary" id="cancel">再看看</button><button class="primary" id="confirm">就这样吧</button></div>`);cancel.onclick=()=>modalWrap.classList.remove('show');confirm.onclick=finishGame}else finishGame()}
function finishGame(){const s=stats(),p=s.star===3?['精算规划型','不是在做饭，是在做资源调度。']:s.c===1?['极限清库存型','今天要救的食材，一个都没浪费。']:['明天再说型','差一点，冰箱里还有个小尾巴。'];P.best['d'+Q[0]]=Math.max(P.best['d'+Q[0]]||0,s.star);P.un=Math.max(P.un,Math.min(8,Q[0]+1));P.last=Q[0]<8?Q[0]+1:8;save();showModal(`<div>今晚的冰箱报告 · DAY ${Q[0]}</div><div class="score">${Math.round(s.c*100)}%</div><b>冰箱清空率</b><div class="stats"><div class="stat">菜品<b>${s.d}道</b></div><div class="stat">营养<b>${s.g}</b></div><div class="stat">星级<b>${stars(s.star)}</b></div></div><div class="personality">${p[0]}</div><p>${p[1]}</p><div class="mvp">${s.left.length?'今晚留下：'+s.left.join('、'):'今天要救的食材，一个都没浪费。'}</div><div class="modal-actions"><button class="secondary" id="retry">重新规划</button><button class="primary" id="next">${Q[0]<8?'下一关':'回到首页'}</button></div>`);retry.onclick=()=>start(Q[0]);next.onclick=()=>Q[0]<8?start(Q[0]+1):home()}
function showModal(html){modal.innerHTML=html;modalWrap.classList.add('show')}function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1600)}home();
</script></body></html>
